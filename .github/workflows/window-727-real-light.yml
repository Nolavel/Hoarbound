name: 727 Real Lighting SDF Test
on:
  push:
    branches: [codex]
    paths:
      - '.github/workflows/window-727-real-light.yml'
      - 'tests/demos/window_727_real_light/**'
      - 'tests/scenes/window_727_real_light.tscn'
      - 'tools/runtime/capture_window_727_real_light.gd'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actual-727-lighting:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Cache Godot
        uses: actions/cache@v4
        with:
          path: ~/.local/opt/godot-mono
          key: godot-4.8-dev6-v2
      - name: Provision Godot and Vulkan llvmpipe + encode
        run: |
          SKIP_APT=1 tools/ci/setup_env.sh
          sudo apt-get update -qq
          sudo apt-get install -y -qq mesa-vulkan-drivers xvfb ffmpeg
      - name: Clean import gate
        run: tools/ci/import_gate.sh
      - name: Render restored original V3 thaw with white frost tint only
        run: |
          set -euo pipefail
          export VK_DRIVER_FILES=/usr/share/vulkan/icd.d/lvp_icd.json
          export XDG_RUNTIME_DIR=/tmp/xdg
          mkdir -p "$XDG_RUNTIME_DIR" docs/runtime_previews/window_727_real_light
          timeout 900 xvfb-run -a "$HOME/.local/bin/godot" \
            --path . --resolution 720x405 --fixed-fps 12 \
            --rendering-driver vulkan --rendering-method forward_plus \
            --audio-driver Dummy \
            --script res://tools/runtime/capture_window_727_real_light.gd \
            2>&1 | tee docs/runtime_previews/window_727_real_light/capture.log
          grep -q 'WINDOW_727_REAL_LIGHT_OK.*shelter_grade=HFN_ColdAsh_Shelter.*weather=calm' docs/runtime_previews/window_727_real_light/capture.log
          grep -q 'WINDOW_727_REAL_LIGHT_CAPTURE_OK frames=72' docs/runtime_previews/window_727_real_light/capture.log
          if grep -Ei 'SCRIPT ERROR|SHADER ERROR|Parse Error|WINDOW_727_REAL_LIGHT_FAIL|Failed loading resource' docs/runtime_previews/window_727_real_light/capture.log; then exit 1; fi
          test "$(find docs/runtime_previews/window_727_real_light/frames -name 'f_*.png' | wc -l)" -eq 72
      - name: Video and real-light stills
        run: |
          set -euo pipefail
          cd docs/runtime_previews/window_727_real_light
          ffmpeg -v error -y -framerate 12 -i frames/f_%03d.png \
            -vf scale=960:540:flags=lanczos \
            -c:v libx264 -crf 19 -pix_fmt yuv420p -movflags +faststart frontwindow1_original_v3_white_frost_6s.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=nb_frames,width,height -of csv=p=0 frontwindow1_original_v3_white_frost_6s.mp4 | grep -q '960,540,72'
          ffmpeg -v error -y -i frames/f_001.png -vf scale=960:540 -frames:v 1 white_tint_start.png
          ffmpeg -v error -y -i frames/f_060.png -vf scale=960:540 -frames:v 1 white_tint_thaw.png
          test -s frontwindow1_original_v3_white_frost_6s.mp4
      - name: Upload real lighting film
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hoarbound-727-v3-white-tint-issue-281
          path: |
            docs/runtime_previews/window_727_real_light/*.mp4
            docs/runtime_previews/window_727_real_light/*.png
            docs/runtime_previews/window_727_real_light/*.log
          if-no-files-found: warn
          retention-days: 5
