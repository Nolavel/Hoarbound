name: release-smoke

## Manual tester build: exports Windows and Linux and publishes them as a GitHub Release.
## Runs from Actions → Run workflow once on main, or on a claudeflow push tagged [release-smoke].
on:
  push:
    branches: [claudeflow]
  workflow_dispatch:
    inputs:
      version:
        description: "Build version (major.MDD)"
        default: "0.312b"
      title:
        description: "Release name after Hoarbound"
        default: "Smoke Test November"

permissions:
  contents: write

concurrency:
  group: release-smoke
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release-smoke]')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      VERSION: ${{ github.event.inputs.version || '0.312b' }}
      TITLE: ${{ github.event.inputs.title || 'Smoke Test November' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache Godot
        uses: actions/cache@v4
        with:
          path: ~/.local/opt/godot-mono
          key: godot-4.8-dev6-v2

      - name: Cache export templates
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates/4.8.dev6.mono
          key: godot-templates-4.8-dev6-mono-v1

      - name: Provision Godot
        run: SKIP_APT=1 tools/ci/setup_env.sh

      - name: Export templates (Windows + Linux only)
        run: |
          dir="$HOME/.local/share/godot/export_templates/4.8.dev6.mono"
          if [ ! -f "$dir/windows_release_x86_64.exe" ]; then
            mkdir -p "$dir"
            curl -sSL -o /tmp/tpl.tpz https://github.com/godotengine/godot-builds/releases/download/4.8-dev6/Godot_v4.8-dev6_mono_export_templates.tpz
            unzip -q -j /tmp/tpl.tpz 'templates/version.txt' 'templates/windows_release_x86_64*' 'templates/linux_release.x86_64' -d "$dir"
            rm /tmp/tpl.tpz
          fi
          ls -la "$dir"

      - name: Import and unpack Reality data
        run: |
          tools/ci/import_gate.sh
          python3 tools/world/reality/export_pack.py unpack

      - name: Export Windows and Linux
        run: |
          mkdir -p ../build/windows ../build/linux
          godot --headless --path . --export-release "Windows Desktop" ../build/windows/Hoarbound.exe 2>&1 | tee ../build/export_windows.log | grep -v "Storing File" | tail -n 60
          godot --headless --path . --export-release "Linux" ../build/linux/Hoarbound.x86_64 2>&1 | tee ../build/export_linux.log | grep -v "Storing File" | tail -n 60
          test -s ../build/windows/Hoarbound.pck && test -s ../build/linux/Hoarbound.pck
          ## The mono runtime refuses to start without its assemblies (0.312b shipped without them).
          for d in ../build/windows/data_Hoarbound_windows_x86_64 ../build/linux/data_Hoarbound_linuxbsd_x86_64; do
            if [ ! -d "$d" ] || [ -z "$(ls -A "$d")" ]; then
              echo "::error::.NET assemblies missing: $d"
              grep -iE "dotnet|\.NET|msbuild|error" ../build/export_windows.log | grep -v "Storing File" | head -n 40
              exit 1
            fi
          done

      - name: Package
        run: |
          name="Hoarbound-${TITLE// /-}-${VERSION}"
          for plat in windows linux; do
            d=../build/$plat
            printf 'Hoarbound %s %s\nCommit: %s\nBuilt: %s\n' "$TITLE" "$VERSION" "$GITHUB_SHA" "$(date -u +%FT%TZ)" > $d/BUILD_INFO.txt
            cp tools/ci/release/README_TESTER.txt $d/
          done
          (cd ../build/windows && zip -qr9 "$GITHUB_WORKSPACE/$name-win64.zip" .)
          (cd ../build/linux && chmod +x Hoarbound.x86_64 && zip -qr9 "$GITHUB_WORKSPACE/$name-linux-x86_64.zip" .)
          sha256sum *.zip > SHA256SUMS.txt
          ls -la *.zip
          echo "NAME=$name" >> "$GITHUB_ENV"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${VERSION}" "$NAME-win64.zip" "$NAME-linux-x86_64.zip" SHA256SUMS.txt \
            --target "$GITHUB_SHA" --prerelease \
            --title "Hoarbound — ${TITLE} ${VERSION}" \
            --notes "Tester build from \`${GITHUB_SHA::8}\` (${GITHUB_REF_NAME}). Windows: unzip, run Hoarbound.exe. Linux: unzip, run ./Hoarbound.x86_64. See README_TESTER.txt."
