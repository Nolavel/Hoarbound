name: camera-tight-trace

## Tight-space camera trace in the 727 shelter: full mouse turn, rest and pitch sweep at four
## spots; per-frame CSV, report.json and turn frames.
## Runs on workflow_dispatch or push with [camera-tight-trace] in the commit message.
## Artifacts: Actions → this run → hoarbound-camera-tight-trace.
on:
  workflow_dispatch:
  push:
    branches: [main, claudeflow]
    paths-ignore:
      - "**/*.md"

concurrency:
  group: camera-tight-trace-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trace:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[camera-tight-trace]'))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/opt/godot-mono
          key: godot-4.8-dev6-v2

      - name: Provision Godot + CPU Vulkan
        run: tools/ci/setup_env.sh

      - name: Import gate
        run: tools/ci/import_gate.sh

      - name: Trace the tight-space camera
        run: |
          export VK_DRIVER_FILES=/usr/share/vulkan/icd.d/lvp_icd.json
          export XDG_RUNTIME_DIR=/tmp/xdg
          OUT=docs/runtime_previews/camera_tight_trace
          mkdir -p "$XDG_RUNTIME_DIR" "$OUT"
          set -o pipefail
          xvfb-run -a "$HOME/.local/bin/godot" \
            --path . \
            --resolution 960x540 \
            --fixed-fps 30 \
            --rendering-driver vulkan \
            --rendering-method forward_plus \
            --audio-driver Dummy \
            --script res://tools/runtime/trace_camera_tight.gd -- "$PWD/$OUT" \
            2>&1 | tee "$OUT/trace.log"
          if grep -q -E "SCRIPT ERROR|SHADER ERROR" "$OUT/trace.log"; then
            echo "Script or shader error in trace log."
            exit 1
          fi
          test -s "$OUT/report.json"
          cat "$OUT/report.json"

      - name: Upload trace artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hoarbound-camera-tight-trace
          path: docs/runtime_previews/camera_tight_trace/
          if-no-files-found: warn
          retention-days: 14
