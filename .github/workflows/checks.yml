name: checks

## `checks` is the cheap gate on every push and PR: import, input map, filenames.
## `grok` is on the same gate as the other agent branches. It is not a second pipeline.
## Test suites run locally until mechanics settle; they churn too fast to gate main.
## Preview/render jobs run only for a commit tagged with their [marker]; the Key West Reality jobs
## also run on a manual dispatch, to re-check the committed snapshot.
on:
  push:
    branches: [main, codex, claudeflow, grok]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:
    inputs:
      preview:
        description: "Empty re-checks Key West Reality; compass runs the First Exit compass preview; snow-surface or snow-walk runs only that capture"
        default: ""
      baseline_ref:
        description: "snow-surface: ref whose snow code is the `old` variant"
        default: "origin/main"

## Each long capture has its own group, so a later push or dispatch of another kind
## does not cancel it.
concurrency:
  group: checks-${{ github.ref }}-${{ contains(github.event.head_commit.message, '[snow-surface]') && 'snow-surface' || contains(github.event.head_commit.message, '[snow-walk]') && 'snow-walk' || github.event.inputs.preview || 'base' }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/opt/godot-mono
          key: godot-4.8-dev6-v2

      - name: Provision Godot (headless only)
        run: SKIP_APT=1 tools/ci/setup_env.sh

      - name: Import gate (clean import, every script compiles)
        run: tools/ci/import_gate.sh

      - name: Input map overlaps
        run: python3 tools/ci/check_input_map.py

      - name: Check filenames and uid files
        run: tools/ci/check_filenames.sh

  compass-preview:
    ## Real Key West viewport of the First Exit compass. Dispatch with preview=compass.
    ## Not a second pipeline: same workflow, Godot, lavapipe and ffmpeg as the other captures.
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.preview == 'compass'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/opt/godot-mono
          key: godot-4.8-dev6-v2

      - name: Provision Godot + CPU Vulkan
        run: tools/ci/setup_env.sh

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Import gate
        run: tools/ci/import_gate.sh

      - name: Capture the compass in Key West
        id: capture
        env:
          OUT: docs/runtime_previews/compass_preview
        run: |
          set -o pipefail
          mkdir -p "$OUT"
          export VK_DRIVER_FILES=/usr/share/vulkan/icd.d/lvp_icd.json
          export XDG_RUNTIME_DIR=/tmp/xdg
          mkdir -p "$XDG_RUNTIME_DIR"
          xvfb-run -a "$HOME/.local/bin/godot" \
            --path . \
            --resolution 960x540 \
            --rendering-driver vulkan \
            --rendering-method forward_plus \
            --audio-driver Dummy \
            --fixed-fps 15 \
            --script res://tools/runtime/capture_compass_preview.gd \
            -- "$OUT" 2>&1 | tee "$OUT/godot.log"
          status=${PIPESTATUS[0]}
          if [ -d "$OUT/frames" ] && ls "$OUT/frames"/frame_*.png >/dev/null 2>&1; then
            ffmpeg -y -loglevel error -framerate 15 -i "$OUT/frames/frame_%04d.png" \
              -c:v libx264 -pix_fmt yuv420p -s 960x540 -crf 20 "$OUT/compass_preview.mp4"
          fi
          if [ -f "$OUT/compass_preview.mp4" ]; then
            dur=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$OUT/compass_preview.mp4")
            echo "compass video duration ${dur}s"
            python3 -c "import sys; d=float(sys.argv[1]); sys.exit(0 if 10.0 <= d <= 15.0 else 1)" "$dur" \
              || { echo "video duration outside 10–15s"; status=1; }
          else
            echo "compass video was not written"
            status=1
          fi
          python3 -c "import json,sys; p=json.load(open(sys.argv[1])); print(p); sys.exit(0 if p.get('passed') else 1)" \
            "$OUT/compass_preview.json" || status=1
          exit "$status"

      - name: Upload compass preview
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: hoarbound-compass-preview
          path: |
            docs/runtime_previews/compass_preview/compass_preview.mp4
            docs/runtime_previews/compass_preview/stills/*.png
            docs/runtime_previews/compass_preview/compass_preview.json
            docs/runtime_previews/compass_preview/godot.log
          if-no-files-found: warn
          retention-days: 7

  key-west-reality:
    if: (github.event_name == 'workflow_dispatch' && github.event.inputs.preview == '') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[key-west-reality]'))
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/opt/godot-mono
          key: godot-4.8-dev6-v2

      - name: Provision Godot + CPU Vulkan
        run: tools/ci/setup_env.sh

      - name: Import gate
        run: tools/ci/import_gate.sh

      - name: Unpack the committed editor interchange (sha256-checked)
        run: python3 tools/world/reality/export_pack.py unpack

      - name: Rebuild the generated chunks and verify the recorded digest
        run: |
          export VK_DRIVER_FILES=/usr/share/vulkan/icd.d/lvp_icd.json
          export XDG_RUNTIME_DIR=/tmp/xdg
          mkdir -p "$XDG_RUNTIME_DIR"
          xvfb-run -a "$HOME/.local/bin/godot" --path . --rendering-driver vulkan --audio-driver Dummy \
            --script tools/world/reality_gen/generate_key_west_chunks_cli.gd -- --verify-digest | tee generate.log
          grep -q "digest verify: identical" generate.log
          grep -q "contract violations: 0" generate.log

      - name: Partial rebuild equals the full build (chunks alone, reverse order)
        run: |
          export VK_DRIVER_FILES=/usr/share/vulkan/icd.d/lvp_icd.json
          export XDG_RUNTIME_DIR=/tmp/xdg
          xvfb-run -a "$HOME/.local/bin/godot" --path . --rendering-driver vulkan --audio-driver Dummy \
            --script tools/world/reality_gen/generate_key_west_chunks_cli.gd -- -6:3 -7:3 --verify-partial | tee partial.log
          grep -q "partial verify: identical" partial.log

      - name: HLOD clean rebuild, digest and source checks
        ## Deletes every proxy, rebuilds them from the source chunk exports, and compares with the recorded digest;
        ## --check fails on missing or duplicate source ids, orphan proxies either way and stale clusters.
        run: |
          export VK_DRIVER_FILES=/usr/share/vulkan/icd.d/lvp_icd.json
          export XDG_RUNTIME_DIR=/tmp/xdg
          xvfb-run -a "$HOME/.local/bin/godot" --path . --rendering-driver vulkan --audio-driver Dummy \
            --script tools/world/reality_gen/build_key_west_hlod_cli.gd -- --clean --all --check --verify-digest | tee hlod.log
          grep -q "hlod check: ok" hlod.log
          grep -q "hlod digest: identical" hlod.log

      - name: HLOD partial rebuild equals the full build (one cluster alone)
        run: |
          export VK_DRIVER_FILES=/usr/share/vulkan/icd.d/lvp_icd.json
          export XDG_RUNTIME_DIR=/tmp/xdg
          xvfb-run -a "$HOME/.local/bin/godot" --path . --rendering-driver vulkan --audio-driver Dummy \
            --script tools/world/reality_gen/build_key_west_hlod_cli.gd -- --verify-partial c128_-21_6 | tee hlod_partial.log
          grep -q "hlod partial verify: identical" hlod_partial.log

      - name: Streaming tests
        run: |
          for t in test_streaming test_key_west_reality_ground test_key_west_reality_hlod test_key_west_reality_hlod_boundary; do
            timeout 300 "$HOME/.local/bin/godot" --headless --path . --audio-driver Dummy --script res://tests/systems/$t.gd | tee $t.log
            grep -q "all checks passed" $t.log
          done

      - name: Dev teleport lands on live ground, outside buildings (real Reality scene)
        run: |
          timeout 900 "$HOME/.local/bin/godot" --headless --path . --audio-driver Dummy \
            --script res://tools/runtime/trace_dev_teleport.gd -- res://docs/runtime_previews/key_west_dev_teleport | grep "teleport trace"
          python3 -c "import json,sys; r=json.load(open('docs/runtime_previews/key_west_dev_teleport/teleport_trace.json')); print(r['failures'], 'wrong'); sys.exit(1 if r['failures'] else 0)"

      - name: Streaming benchmark (island drive)
        run: |
          timeout 1200 "$HOME/.local/bin/godot" --headless --path . --script tools/runtime/benchmark_key_west_reality_streaming.gd \
            -- res://docs/runtime_previews/key_west_reality_streaming island

      - name: Production gate (full World, Henry by input, fast mode)
        run: |
          timeout 2700 "$HOME/.local/bin/godot" --headless --path . --audio-driver Dummy \
            --script res://tools/runtime/gate_key_west_reality.gd -- --fast --out=res://docs/runtime_previews/key_west_reality_gate \
            | grep "gate:" | grep -v PerfJSON || true
          python3 -c "import json,sys; v=json.load(open('docs/runtime_previews/key_west_reality_gate/gate_report.json'))['verdict']; print(v); sys.exit(0 if all(v.values()) else 1)"

      - name: Production gate A/B without HLOD proxies (diagnostic, manual runs only)
        ## Same gate with the HLOD view removed (detail cells still stream); compare its hitch lines with the gate above.
        if: always() && github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: |
          timeout 2700 "$HOME/.local/bin/godot" --headless --path . --audio-driver Dummy \
            --script res://tools/runtime/gate_key_west_reality.gd -- --fast --no-hlod --out=res://docs/runtime_previews/key_west_reality_gate_no_hlod | grep "gate:" | grep -v PerfJSON

      - name: Upload reality reports
        if: always()
        uses: actions/upload-artifact@v4
        ## Reports only: a full artifact quota must not fail the checks.
        continue-on-error: true
        with:
          name: hoarbound-key-west-reality
          path: |
            docs/runtime_previews/key_west_reality_streaming/*.json
            docs/runtime_previews/key_west_reality_gate/*.json
            scenes/world/key_west/generated/generation_report.json
          if-no-files-found: warn
          retention-days: 3

  key-west-reality-fresh:
    ## Zero-setup review path: the committed snapshot exactly as cloned; no unpack, export or
    ## generation (the rebuild/digest job above is the reproducibility check).
    if: (github.event_name == 'workflow_dispatch' && github.event.inputs.preview == '') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[key-west-reality]'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/opt/godot-mono
          key: godot-4.8-dev6-v2

      - name: Provision Godot (headless only)
        run: SKIP_APT=1 tools/ci/setup_env.sh

      - name: Import gate
        run: tools/ci/import_gate.sh

      - name: Fresh-checkout runtime tests
        run: |
          for t in test_key_west_reality_fresh_checkout test_key_west_reality_first_exit test_key_west_727_shelter; do
            timeout 600 "$HOME/.local/bin/godot" --headless --path . --audio-driver Dummy --script res://tests/systems/$t.gd | tee $t.log
            grep -q "all checks passed" $t.log
          done

      - name: 727 shelter loop (enter, repair, fire, warm, eat, sleep, save, reload)
        ## Judged by the report verdict, not the exit code.
        run: |
          timeout 1500 "$HOME/.local/bin/godot" --headless --path . --audio-driver Dummy \
            --script res://tools/runtime/loop_key_west_727.gd -- --out=res://docs/runtime_previews/key_west_727_loop
          python3 -c "import json,sys; v=json.load(open('docs/runtime_previews/key_west_727_loop/loop_report.json'))['verdict']; print(v); sys.exit(0 if v and all(v.values()) else 1)"

      - name: Upload loop report
        if: always()
        uses: actions/upload-artifact@v4
        ## Reports only: a full artifact quota must not fail the checks.
        continue-on-error: true
        with:
          name: hoarbound-key-west-727-loop
          path: docs/runtime_previews/key_west_727_loop/loop_report.json
          if-no-files-found: warn
          retention-days: 3

  key-west-preview:
    ## Lavapipe/Forward+ captures on the Key West Reality scene, chosen by a commit tag.
    ## Painterly preview is diagnostic A/B: CONTROL and TEST run as independent Godot processes.
    if: github.event_name == 'push' && (contains(github.event.head_commit.message, '[painterly-wash-preview]') || contains(github.event.head_commit.message, '[stylized-shadows]') || contains(github.event.head_commit.message, '[sky-weather-preview]'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/opt/godot-mono
          key: godot-4.8-dev6-v2

      - name: Provision Godot + CPU Vulkan
        run: tools/ci/setup_env.sh

      - name: Install video tools
        if: contains(github.event.head_commit.message, '[painterly-wash-preview]')
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Import gate
        run: tools/ci/import_gate.sh

      - name: Capture Key West (non-painterly previews)
        if: ${{ !contains(github.event.head_commit.message, '[painterly-wash-preview]') }}
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          export VK_DRIVER_FILES=/usr/share/vulkan/icd.d/lvp_icd.json
          export XDG_RUNTIME_DIR=/tmp/xdg
          mkdir -p "$XDG_RUNTIME_DIR"
          if [[ "$COMMIT_MESSAGE" == *"[sky-weather-preview]"* ]]; then
            SCRIPT="tools/runtime/capture_sky_weather.gd"
          else
            "$HOME/.local/bin/godot" --headless --path . --script tests/systems/test_stylized_shadows.gd
            SCRIPT="tools/runtime/capture_stylized_shadows.gd"
          fi
          mkdir -p docs/runtime_previews/key_west
          set -o pipefail
          xvfb-run -a "$HOME/.local/bin/godot" \
            --path . \
            --resolution 1600x1000 \
            --rendering-driver vulkan \
            --rendering-method forward_plus \
            --audio-driver Dummy \
            --script "$SCRIPT" 2>&1 | tee docs/runtime_previews/key_west/capture.log
          if grep -q "SHADER ERROR" docs/runtime_previews/key_west/capture.log; then
            echo "Shader compilation error found in capture log."
            exit 1
          fi

      - name: Painterly A/B CONTROL (post OFF, surface OFF, full blizzard)
        id: painterly_control
        if: contains(github.event.head_commit.message, '[painterly-wash-preview]')
        run: |
          export VK_DRIVER_FILES=/usr/share/vulkan/icd.d/lvp_icd.json
          export XDG_RUNTIME_DIR=/tmp/xdg
          mkdir -p "$XDG_RUNTIME_DIR"
          OUT="docs/runtime_previews/key_west/painterly_ab/control"
          mkdir -p "$OUT"
          set +e
          timeout 420 xvfb-run -a "$HOME/.local/bin/godot" \
            --path . \
            --resolution 1600x1000 \
            --rendering-driver vulkan \
            --rendering-method forward_plus \
            --audio-driver Dummy \
            --script tools/runtime/diagnose_painterly_ab.gd \
            -- "res://$OUT" control >"$OUT/capture.log" 2>&1
          rc=$?
          if grep -q "SHADER ERROR" "$OUT/capture.log"; then rc=90; fi
          count=$(find "$OUT/frames" -maxdepth 1 -type f -name 'frame_*.png' 2>/dev/null | wc -l)
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          echo "frame_count=$count" >> "$GITHUB_OUTPUT"
          echo "PAINTERLY_AB CONTROL exit=$rc frames=$count"
          exit 0

      - name: Painterly A/B TEST (post ON, surface ON, full blizzard)
        id: painterly_test
        if: contains(github.event.head_commit.message, '[painterly-wash-preview]')
        run: |
          export VK_DRIVER_FILES=/usr/share/vulkan/icd.d/lvp_icd.json
          export XDG_RUNTIME_DIR=/tmp/xdg
          mkdir -p "$XDG_RUNTIME_DIR"
          OUT="docs/runtime_previews/key_west/painterly_ab/test"
          mkdir -p "$OUT"
          set +e
          timeout 420 xvfb-run -a "$HOME/.local/bin/godot" \
            --path . \
            --resolution 1600x1000 \
            --rendering-driver vulkan \
            --rendering-method forward_plus \
            --audio-driver Dummy \
            --script tools/runtime/diagnose_painterly_ab.gd \
            -- "res://$OUT" test >"$OUT/capture.log" 2>&1
          rc=$?
          if grep -q "SHADER ERROR" "$OUT/capture.log"; then rc=90; fi
          count=$(find "$OUT/frames" -maxdepth 1 -type f -name 'frame_*.png' 2>/dev/null | wc -l)
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          echo "frame_count=$count" >> "$GITHUB_OUTPUT"
          echo "PAINTERLY_AB TEST exit=$rc frames=$count"
          exit 0

      - name: Encode painterly A/B evidence
        if: always() && contains(github.event.head_commit.message, '[painterly-wash-preview]')
        run: |
          set +e
          ROOT="docs/runtime_previews/key_west/painterly_ab"
          for arm in control test; do
            dir="$ROOT/$arm"
            last=$(find "$dir/frames" -maxdepth 1 -type f -name 'frame_*.png' 2>/dev/null | sort | tail -n 1)
            if [[ -n "$last" ]]; then cp "$last" "$dir/last_partial.png"; fi
            count=$(find "$dir/frames" -maxdepth 1 -type f -name 'frame_*.png' 2>/dev/null | wc -l)
            if [[ "$count" -eq 72 ]]; then
              ffmpeg -y -framerate 12 -i "$dir/frames/frame_%04d.png" \
                -c:v libx264 -preset medium -crf 18 -pix_fmt yuv420p -movflags +faststart \
                "$dir/${arm}_walk.mp4" >/dev/null 2>&1
            fi
          done
          if [[ -s "$ROOT/control/control_walk.mp4" && -s "$ROOT/test/test_walk.mp4" ]]; then
            ffmpeg -y \
              -i "$ROOT/control/control_walk.mp4" \
              -i "$ROOT/test/test_walk.mp4" \
              -filter_complex "[0:v]crop=iw/2:ih:0:0[left];[1:v]crop=iw/2:ih:iw/2:0[right];[left][right]hstack=inputs=2,drawbox=x=iw/2-2:y=0:w=4:h=ih:color=white@0.9:t=fill,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='CONTROL  PAINTERLY OFF':fontcolor=white:fontsize=34:x=34:y=34:box=1:boxcolor=black@0.68:boxborderw=14,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='TEST  PAINTERLY ON':fontcolor=white:fontsize=34:x=w/2+34:y=34:box=1:boxcolor=0x155A66@0.82:boxborderw=14[split]" \
              -map "[split]" -an -c:v libx264 -preset medium -crf 18 -pix_fmt yuv420p -movflags +faststart \
              docs/runtime_previews/key_west/painterly_ab_split_6s.mp4 >/dev/null 2>&1
          fi
          exit 0

      - name: Classify painterly A/B
        if: always() && contains(github.event.head_commit.message, '[painterly-wash-preview]')
        env:
          CONTROL_RC: ${{ steps.painterly_control.outputs.exit_code }}
          TEST_RC: ${{ steps.painterly_test.outputs.exit_code }}
          CONTROL_FRAMES: ${{ steps.painterly_control.outputs.frame_count }}
          TEST_FRAMES: ${{ steps.painterly_test.outputs.frame_count }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          from pathlib import Path

          def integer(name, fallback=-1):
              try:
                  return int(os.environ.get(name, ""))
              except ValueError:
                  return fallback

          cr = integer("CONTROL_RC")
          tr = integer("TEST_RC")
          cf = integer("CONTROL_FRAMES", 0)
          tf = integer("TEST_FRAMES", 0)
          expected = 72

          if cr == 0 and tr == 0 and cf == expected and tf == expected:
              classification = "BOTH_ARMS_PASS__COMBINED_HARNESS_OR_ACCEPTANCE_SUSPECT"
              ok = True
          elif cr != 0 and tr != 0:
              classification = "COMMON_SCENE_RUNTIME_RENDERER_OR_INIT_FAILURE"
              ok = False
          elif cr == 0 and tr != 0:
              classification = "PAINTERLY_PATH_FAILURE"
              ok = False
          elif cr != 0 and tr == 0:
              classification = "CONTROL_ONLY_FAILURE_OR_HARNESS_ASYMMETRY"
              ok = False
          else:
              classification = "CAPTURE_OUTPUT_FAILURE"
              ok = False

          report = {
              "diagnostic": "independent-process painterly A/B",
              "renderer_contract": "Lavapipe Vulkan / Forward+",
              "weather": "blizzard",
              "expected_frames_per_arm": expected,
              "control": {"exit_code": cr, "frame_count": cf, "painterly_post": False, "painterly_surface_strength": 0.0},
              "test": {"exit_code": tr, "frame_count": tf, "painterly_post": True, "painterly_surface_strength": 1.0},
              "classification": classification,
              "passes_diagnostic": ok,
          }
          out = Path("docs/runtime_previews/key_west/source_report.json")
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(report, indent=2), encoding="utf-8")
          print("PAINTERLY_AB_CLASSIFICATION", classification)
          print(json.dumps(report, indent=2))
          sys.exit(0 if ok else 1)
          PY

      - name: Upload Key West previews
        if: always()
        uses: actions/upload-artifact@v4
        ## Reports only: a full artifact quota must not fail the checks.
        continue-on-error: true
        with:
          name: ${{ contains(github.event.head_commit.message, '[painterly-wash-preview]') && 'hoarbound-painterly-wash' || (contains(github.event.head_commit.message, '[sky-weather-preview]') && 'hoarbound-sky-weather' || 'hoarbound-stylized-shadows') }}
          path: |
            docs/runtime_previews/key_west/*.png
            docs/runtime_previews/key_west/*.mp4
            docs/runtime_previews/key_west/capture.log
            docs/runtime_previews/key_west/source_report.json
            docs/runtime_previews/key_west/painterly_ab/*/*.png
            docs/runtime_previews/key_west/painterly_ab/*/*.mp4
            docs/runtime_previews/key_west/painterly_ab/*/*.log
            docs/runtime_previews/key_west/painterly_ab/*/*.json
            docs/runtime_previews/stylized_shadows/*.png
            docs/runtime_previews/stylized_shadows/report.json
            docs/runtime_previews/sky_weather/*.png
            docs/runtime_previews/sky_weather/report.json
          if-no-files-found: warn
          retention-days: 3

  snow-surface:
    ## Snow surface stability A/B on Duval Street (tools/runtime/capture_snow_surface.gd):
    ## `new` is this commit; a dispatch also runs `old`, the snow shell/shaders of `baseline_ref`.
    ## Dispatch with preview=snow-surface, or push with [snow-surface] in the commit message.
    if: >
      (github.event_name == 'workflow_dispatch' && github.event.inputs.preview == 'snow-surface') ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[snow-surface]'))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["new","old"]' || '["new"]') }}
    env:
      OUT: docs/runtime_previews/snow_surface/${{ matrix.variant }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache Godot
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/opt/godot-mono
          key: godot-4.8-dev6-v2

      - name: Provision Godot + CPU Vulkan
        run: tools/ci/setup_env.sh

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Swap in the baseline snow code (old variant)
        if: matrix.variant == 'old'
        env:
          BASELINE: ${{ github.event.inputs.baseline_ref || 'origin/main' }}
        run: |
          git checkout "$BASELINE" -- scripts/systems/world/snow shaders/environment/snow scripts/settings/graphics_quality.gd
          rm -f scripts/systems/world/snow/snow_clipmap.gd* shaders/environment/snow/snow_far_cover.gdshaderinc* tests/systems/test_snow_clipmap.gd*
          ## The baseline shaders predate the witness readout: add the same debug_height branch.
          python3 - <<'PY'
          from pathlib import Path
          inc = Path("shaders/environment/snow/snow_surface.gdshaderinc")
          text = inc.read_text()
          if "snow_debug_height" not in text:
              inc.write_text(text + "\nvec3 snow_debug_height(float y) {\n\tvec3 v = vec3(fract(y / 4.0), fract(y / 0.25), fract(y / 0.016));\n\treturn mix(v / 12.92, pow((v + 0.055) / 1.055, vec3(2.4)), step(vec3(0.04045), v));\n}\n")
          for name in ("snow_ground.gdshader", "snow_chunk_cover.gdshader"):
              p = Path("shaders/environment/snow") / name
              s = p.read_text()
              if "debug_height" in s:
                  continue
              s = s.replace("varying vec3 v_world;", "uniform bool debug_height = false;\nvarying vec3 v_world;", 1)
              end = s.rindex("}", 0, s.index("\n\nvoid light()"))
              s = s[:end] + "\tif (debug_height) {\n\t\tALBEDO = vec3(0.0);\n\t\tROUGHNESS = 1.0;\n\t\tSPECULAR = 0.0;\n\t\tEMISSION = snow_debug_height(v_world.y);\n\t}\n" + s[end:]
              p.write_text(s)
          PY
          git status --short

      - name: Import gate
        run: tools/ci/import_gate.sh

      - name: Snow suites (new variant)
        if: matrix.variant == 'new'
        run: |
          for suite in test_snow_clipmap test_snow_shell test_snow_contact_pipeline test_snow_tracks test_snow_presentation; do
            log="$(mktemp)"
            "$HOME/.local/bin/godot" --headless --path . --audio-driver Dummy --script "res://tests/systems/$suite.gd" 2>&1 | tee "$log"
            if grep -qE "SCRIPT ERROR|Parse Error|check\(s\) failed|FAIL" "$log"; then
              echo "FAILED: $suite"; exit 1
            fi
          done

      - name: Capture Duval Street walk
        run: |
          export VK_DRIVER_FILES=/usr/share/vulkan/icd.d/lvp_icd.json
          export XDG_RUNTIME_DIR=/tmp/xdg
          mkdir -p "$XDG_RUNTIME_DIR" "$OUT"
          xvfb-run -a -s "-screen 0 1920x1080x24" "$HOME/.local/bin/godot" \
            --path . \
            --rendering-driver vulkan \
            --rendering-method forward_plus \
            --audio-driver Dummy \
            --fixed-fps 30 \
            --script res://tools/runtime/capture_snow_surface.gd -- "$OUT" 10 > "$OUT/raw.log" 2>&1 || status=$?
          grep '^\[PerfJSON\]' "$OUT/raw.log" | sed 's/^\[PerfJSON\] //' > "$OUT/perf.jsonl" || true
          grep -v PerfJSON "$OUT/raw.log" > "$OUT/capture.log" || true
          rm -f "$OUT/raw.log"
          tail -n 40 "$OUT/capture.log"
          [ "${status:-0}" -eq 0 ] || exit "$status"
          if grep -qE "SHADER ERROR|SCRIPT ERROR|SNOW_SURFACE_CAPTURE FAIL" "$OUT/capture.log"; then
            echo "Capture reported an error."
            exit 1
          fi

      - name: Height witness analysis
        run: |
          python3 -m pip install --quiet numpy pillow
          python3 tools/runtime/analyze_snow_surface.py "$OUT"
          ## Artifacts are not reachable from every reviewer's sandbox: the sheet also goes to the log.
          echo "REVIEW_SHEET_BEGIN"; base64 -w 0 "$OUT/review_sheet.jpg"; echo; echo "REVIEW_SHEET_END"

      - name: Encode videos
        if: always()
        run: |
          for view in oblique tps witness; do
            if ls "$OUT/$view"/*.png >/dev/null 2>&1; then
              ffmpeg -y -loglevel error -framerate 10 -i "$OUT/$view/%04d.png" -vf "scale=960:-2" -c:v libx264 -pix_fmt yuv420p -crf 22 "$OUT/$view.mp4"
            fi
          done

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        ## Reports only: a full artifact quota must not fail the checks.
        continue-on-error: true
        with:
          name: hoarbound-snow-surface-${{ matrix.variant }}
          path: |
            ${{ env.OUT }}/*.json
            ${{ env.OUT }}/*.png
            ${{ env.OUT }}/*.mp4
            ${{ env.OUT }}/capture.log
            ${{ env.OUT }}/oblique/0000.png
            ${{ env.OUT }}/tps/0000.png
          if-no-files-found: warn
          retention-days: 3

  snow-walk:
    ## Henry's walk through the snowpack on Duval Street (tools/runtime/capture_snow_walk.gd):
    ## TPS and leg-height videos of crust holding and breaking, drift pockets and boot prints,
    ## in fresh loose snow and in an old dry crust (snowpack firmness 0 and 1).
    ## Dispatch with preview=snow-walk, or push with [snow-walk] in the commit message.
    if: >
      (github.event_name == 'workflow_dispatch' && github.event.inputs.preview == 'snow-walk') ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[snow-walk]'))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        snowpack: [fresh, crust]
    env:
      OUT: docs/runtime_previews/snow_walk/${{ matrix.snowpack }}
      FIRMNESS: ${{ matrix.snowpack == 'fresh' && '0.0' || '1.0' }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/opt/godot-mono
          key: godot-4.8-dev6-v2

      - name: Provision Godot + CPU Vulkan
        run: tools/ci/setup_env.sh

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Import gate
        run: tools/ci/import_gate.sh

      - name: Snow suites
        run: |
          for suite in test_snow_resistance test_snow_presentation test_snow_contact_pipeline test_snow_shell test_snow_clipmap; do
            log="$(mktemp)"
            "$HOME/.local/bin/godot" --headless --path . --audio-driver Dummy --script "res://tests/systems/$suite.gd" 2>&1 | tee "$log"
            if grep -qE "SCRIPT ERROR|Parse Error|check\(s\) failed|FAIL" "$log"; then
              echo "FAILED: $suite"; exit 1
            fi
          done

      - name: Capture the walk
        run: |
          export VK_DRIVER_FILES=/usr/share/vulkan/icd.d/lvp_icd.json
          export XDG_RUNTIME_DIR=/tmp/xdg
          mkdir -p "$XDG_RUNTIME_DIR" "$OUT"
          xvfb-run -a -s "-screen 0 1920x1080x24" "$HOME/.local/bin/godot" \
            --path . \
            --rendering-driver vulkan \
            --rendering-method forward_plus \
            --audio-driver Dummy \
            --fixed-fps 30 \
            --script res://tools/runtime/capture_snow_walk.gd -- "$OUT" "$FIRMNESS" > "$OUT/raw.log" 2>&1 || status=$?
          grep -v PerfJSON "$OUT/raw.log" > "$OUT/capture.log" || true
          rm -f "$OUT/raw.log"
          tail -n 40 "$OUT/capture.log"
          [ "${status:-0}" -eq 0 ] || exit "$status"
          if grep -qE "SHADER ERROR|SCRIPT ERROR|SNOW_WALK_CAPTURE FAIL" "$OUT/capture.log"; then
            echo "Capture reported an error."
            exit 1
          fi

      - name: Encode videos and review sheet
        if: always()
        run: |
          for view in tps legs; do
            if ls "$OUT/$view"/*.png >/dev/null 2>&1; then
              ffmpeg -y -loglevel error -framerate 15 -i "$OUT/$view/%04d.png" -vf "scale=960:-2" -c:v libx264 -pix_fmt yuv420p -crf 22 "$OUT/$view.mp4"
            fi
          done
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          from PIL import Image
          out = Path(os.environ["OUT"])
          tiles = []
          for view in ("legs", "tps"):
              frames = sorted((out / view).glob("*.png"))
              if frames:
                  tiles += [frames[int(i * (len(frames) - 1) / 3)] for i in (0, 1, 2, 3)]
          tiles += sorted(out.glob("prints_*.png"))
          if tiles:
              cols = 4
              rows = (len(tiles) + cols - 1) // cols
              sheet = Image.new("RGB", (480 * cols, 270 * rows))
              for k, t in enumerate(tiles):
                  sheet.paste(Image.open(t).convert("RGB").resize((480, 270)), ((k % cols) * 480, (k // cols) * 270))
              sheet.save(out / "review_sheet.jpg", quality=72)
          report = out / "report.json"
          if report.exists():
              data = json.loads(report.read_text())
              frames = data["frames"]
              deepest = max((max(f["sink"]) for f in frames), default=0.0)
              feet = [b for f in frames for b in f.get("feet", []) if b["depth"] > 0.05]
              ghosts = [b for b in feet if b["pressed"] < 0.01]
              print("SNOW_WALK_GHOSTS", json.dumps({"standing_in_snow": len(feet), "no_print": len(ghosts), "examples": ghosts[:8]}))
              print("SNOW_WALK_SUMMARY", json.dumps({"firmness": data.get("firmness"), "plunges": data["plunges"], "frames": len(frames), "deepest_sink_m": deepest,
                  "max_depth_m": max((f["depth"] for f in frames), default=0.0)}))
          PY
          ## Artifacts are not reachable from every reviewer's sandbox: the sheet also goes to the log.
          if [ -f "$OUT/review_sheet.jpg" ]; then echo "REVIEW_SHEET_BEGIN"; base64 -w 0 "$OUT/review_sheet.jpg"; echo; echo "REVIEW_SHEET_END"; fi

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        ## Reports only: a full artifact quota must not fail the checks.
        continue-on-error: true
        with:
          name: hoarbound-snow-walk-${{ matrix.snowpack }}
          path: |
            ${{ env.OUT }}/*.mp4
            ${{ env.OUT }}/*.png
            ${{ env.OUT }}/*.jpg
            ${{ env.OUT }}/report.json
            ${{ env.OUT }}/capture.log
          if-no-files-found: warn
          retention-days: 3
