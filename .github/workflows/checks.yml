name: checks

## Cheap gate for main: import, input map and filename hygiene. Test suites are
## run locally until mechanics settle; they churn too fast to gate main.
## No rendering here; render locally with tools/ci/render.sh.
on:
  push:
    branches: [main, codex, claudeflow]
    paths:
      - "scripts/systems/world/ColorGradeController.gd"
      - "scripts/systems/world/DayNightManager.gd"
      - "scripts/systems/world/DayNightSettings.gd"
      - "scripts/systems/world/WeatherController.gd"
      - "scenes/game/systems/world/WorldEnvironmentSystem.tscn"
      - "resources/environment/color_grading/**"
      - "assets/textures/color_grading/**"
      - "tools/runtime/capture_color_grading.gd"
      - "tools/runtime/capture_key_west.gd"
      - "tools/runtime/capture_key_west_tps.gd"
      - "tools/runtime/capture_key_west_first_exit.gd"
      - "tools/runtime/capture_sky_weather.gd"
      - "shaders/environment/freemans_parallax_clouds.gdshader"
      - "scripts/ui/debug/**"
      - "scripts/ui/menu/camera_settings_panel.gd"
      - "scripts/settings/**"
      - "tools/runtime/capture_camera_settings.gd"
      - "scenes/ui/debug/**"
      - "tools/runtime/capture_dev_diorama_map.gd"
      - "tests/systems/test_dev_diorama_map.gd"
      - "scripts/experimental/motion_matching/**"
      - "scripts/systems/motion_matching/**"
      - "data/motion_matching/**"
      - "scripts/actors/player/henry/components/motion_matching_locomotion.gd"
      - "tests/motion_matching/**"
      - "tools/runtime/capture_motion_matching_lab.gd"
      - "tools/runtime/capture_motion_matching_player.gd"
      - "tools/ci/prepare_cmu_sample.sh"
      - "Jenova/**"
      - "scripts/experimental/jenova_frost/**"
      - "scenes/experimental/jenova_frost_lab.tscn"
      - "tools/ci/bootstrap_jenova_linux.sh"
      - "tools/ci/bootstrap_jenova_windows.ps1"
      - "tools/ci/build_jenova_project.gd"
      - "tools/runtime/capture_jenova_frost.gd"
      - ".github/workflows/checks.yml"
      - "scripts/world/key_west_first_exit.gd"
      - "scenes/world/key_west/key_west_first_exit.tscn"
      - "core/world/resources/world_profile.gd"
      - "core/world/streaming_system.gd"
      - "world/world.gd"
      - "data/world_profiles/key_west_test.tres"
      - "tests/systems/test_key_west_first_exit.gd"
      - "tests/systems/test_streaming.gd"
      - "scripts/systems/world/city/chunked_city_massing.gd"
      - "tools/world/build_key_west_preview.sh"
      - "tools/world/build_key_west_city_preview.py"
      - "project.godot"
      - "shaders/environment/stylized_shadow.gdshaderinc"
      - "shaders/environment/stylized_shadows.gdshader"
      - "shaders/environment/materials/**"
      - "shaders/environment/terrain/island_terrain.gdshader"
      - "shaders/environment/snow/**"
      - "shaders/environment/ice/**"
      - "scripts/systems/world/materials/**"
      - "scripts/systems/world/city/key_west_city_visuals.gd"
      - "scripts/systems/world/city/key_west_street_props.gd"
      - "scripts/environment/interactive/hinged_door.gd"
      - "scripts/environment/interactive/meal_table.gd"
      - "scripts/systems/survival/shelter_breach.gd"
      - "tools/runtime/capture_stylized_shadows.gd"
      - "tests/systems/test_stylized_shadows.gd"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}${{ (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[jenova-windows-build]'))) && '-jenova' || '' }}
  cancel-in-progress: true

jobs:
  checks:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/opt/godot-mono
          key: godot-4.8-dev6-v2

      - name: Provision Godot (headless only)
        run: SKIP_APT=1 tools/ci/setup_env.sh

      - name: Import gate (clean import, every script compiles)
        run: tools/ci/import_gate.sh

      - name: Input map overlaps
        run: python3 tools/ci/check_input_map.py

      - name: Check filenames and uid files
        run: tools/ci/check_filenames.sh

  color-grade-preview:
    if: github.event_name == 'push' && github.ref_name != 'claudeflow' && !contains(github.event.head_commit.message, '[key-west-preview]') && !contains(github.event.head_commit.message, '[key-west-tps]') && !contains(github.event.head_commit.message, '[key-west-first-exit]') && !contains(github.event.head_commit.message, '[dev-map-preview]') && !contains(github.event.head_commit.message, '[stylized-shadows]') && !contains(github.event.head_commit.message, '[sky-weather-preview]') && !contains(github.event.head_commit.message, '[settings-preview]') && !contains(github.event.head_commit.message, '[motion-matching-preview]') && !contains(github.event.head_commit.message, '[jenova-frost-preview]') && !contains(github.event.head_commit.message, '[jenova-windows-build]')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/opt/godot-mono
          key: godot-4.8-dev6-v2

      - name: Provision Godot
        run: SKIP_APT=1 tools/ci/setup_env.sh

      - name: Import gate
        run: tools/ci/import_gate.sh

      - name: Capture four colour grades
        run: |
          export VK_DRIVER_FILES=/usr/share/vulkan/icd.d/lvp_icd.json
          export XDG_RUNTIME_DIR=/tmp/xdg
          mkdir -p "$XDG_RUNTIME_DIR"
          xvfb-run -a "$HOME/.local/bin/godot" \
            --path . \
            --rendering-driver vulkan \
            --rendering-method forward_plus \
            --audio-driver Dummy \
            --script tools/runtime/capture_color_grading.gd

      - name: Upload colour grade previews
        uses: actions/upload-artifact@v4
        with:
          name: hoarbound-color-grades
          path: docs/runtime_previews/color_grading/*.png
          if-no-files-found: error
          retention-days: 3

  settings-preview:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[settings-preview]')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/opt/godot-mono
          key: godot-4.8-dev6-v2

      - name: Provision Godot + CPU Vulkan
        run: tools/ci/setup_env.sh

      - name: Import gate
        run: tools/ci/import_gate.sh

      - name: Capture camera settings states
        run: |
          export VK_DRIVER_FILES=/usr/share/vulkan/icd.d/lvp_icd.json
          export XDG_RUNTIME_DIR=/tmp/xdg
          mkdir -p "$XDG_RUNTIME_DIR"
          xvfb-run -a "$HOME/.local/bin/godot" \
            --path . \
            --resolution 1600x1000 \
            --rendering-driver vulkan \
            --rendering-method forward_plus \
            --audio-driver Dummy \
            --script tools/runtime/capture_camera_settings.gd

      - name: Upload camera settings previews
        uses: actions/upload-artifact@v4
        with:
          name: hoarbound-camera-settings
          path: |
            docs/runtime_previews/camera_settings/*.png
            docs/runtime_previews/camera_settings/report.json
          if-no-files-found: error
          retention-days: 3

  jenova-frost-preview:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[jenova-frost-preview]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/opt/godot-mono
          key: godot-4.8-dev6-v2

      - name: Provision Godot + CPU Vulkan
        run: tools/ci/setup_env.sh

      - name: Install Jenova native build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang-19 lld-19 cmake ninja-build libssl-dev libzstd-dev libidn2-dev ffmpeg
          echo "CC=/usr/bin/clang-19" >> "$GITHUB_ENV"
          echo "CXX=/usr/bin/clang++-19" >> "$GITHUB_ENV"
          sudo ln -sf /usr/bin/clang-19 /usr/local/bin/clang
          sudo ln -sf /usr/bin/clang++-19 /usr/local/bin/clang++
          clang++ --version | head -n 1

      - name: Build Jenova Runtime + Godot 4.8-dev6 SDK
        run: bash tools/ci/bootstrap_jenova_linux.sh

      - name: Build C++ scripts through Jenova BuildProject
        run: |
          set -o pipefail
          export XDG_RUNTIME_DIR=/tmp/xdg
          mkdir -p "$XDG_RUNTIME_DIR"
          xvfb-run -a "$HOME/.local/bin/godot" \
            --editor \
            --path . \
            --rendering-driver opengl3 \
            --audio-driver Dummy \
            --script tools/ci/build_jenova_project.gd 2>&1 | tee /tmp/jenova-build.log
          grep -q "JENOVA_BUILD_OK" /tmp/jenova-build.log

      - name: Capture 6.5 second frost pass
        run: |
          export VK_DRIVER_FILES=/usr/share/vulkan/icd.d/lvp_icd.json
          export XDG_RUNTIME_DIR=/tmp/xdg
          mkdir -p "$XDG_RUNTIME_DIR"
          xvfb-run -a "$HOME/.local/bin/godot" \
            --path . \
            --resolution 1280x720 \
            --rendering-driver vulkan \
            --rendering-method forward_plus \
            --audio-driver Dummy \
            --script tools/runtime/capture_jenova_frost.gd

      - name: Encode frost video and retain proof frames
        run: |
          D=docs/runtime_previews/jenova_frost
          ffmpeg -y -framerate 30 -i "$D/frames/%04d.png" \
            -c:v libx264 -preset veryfast -crf 20 -pix_fmt yuv420p \
            -movflags +faststart "$D/jenova_frost_6_5s.mp4"
          ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$D/jenova_frost_6_5s.mp4"
          rm -rf "$D/frames"

      - name: Upload Jenova frost proof
        uses: actions/upload-artifact@v4
        with:
          name: hoarbound-jenova-frost-proof
          path: |
            docs/runtime_previews/jenova_frost/*.mp4
            docs/runtime_previews/jenova_frost/*.png
            docs/runtime_previews/jenova_frost/stages/*.png
            docs/runtime_previews/jenova_frost/report.json
            Jenova/HOARBOUND_JENOVA_BUILD.txt
          if-no-files-found: error
          retention-days: 7

      - name: Upload Linux Jenova vendor candidate
        uses: actions/upload-artifact@v4
        with:
          name: hoarbound-jenova-linux-vendor
          path: Jenova/**
          if-no-files-found: error
          retention-days: 7

  jenova-windows-build:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[jenova-windows-build]'))
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Build Hoarbound .NET project
        run: dotnet build Hoarbound.csproj --configuration Debug

      - name: Install Godot 4.8-dev6 Mono
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "godot-4.8-dev6-mono-win64.zip"
          $install = Join-Path $env:RUNNER_TEMP "godot-4.8-dev6-mono-win64"
          Invoke-WebRequest `
            -Uri "https://github.com/godotengine/godot-builds/releases/download/4.8-dev6/Godot_v4.8-dev6_mono_win64.zip" `
            -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $install
          $godot = Get-ChildItem -LiteralPath $install -Filter "Godot_v4.8-dev6_mono_win64.exe" -File -Recurse |
            Select-Object -First 1
          if (-not $godot) {
            $contents = Get-ChildItem -LiteralPath $install -File -Recurse |
              ForEach-Object { $_.FullName }
            throw "Godot 4.8-dev6 Mono executable was not found. Archive files: $($contents -join ', ')"
          }
          "GODOT_BIN=$($godot.FullName)" >> $env:GITHUB_ENV

      - name: Build and validate native Windows Jenova runtime
        shell: pwsh
        run: ./tools/ci/bootstrap_jenova_windows.ps1

      - name: Build frost C++ script through Jenova BuildProject
        shell: pwsh
        run: |
          $buildLog = Join-Path $env:RUNNER_TEMP "jenova-build.log"
          & $env:GODOT_BIN --headless --editor --path . --script tools/ci/build_jenova_project.gd 2>&1 |
            Tee-Object -FilePath $buildLog
          if ($LASTEXITCODE -ne 0) {
            throw "Godot Jenova BuildProject harness failed; see $buildLog"
          }
          if (-not (Select-String -LiteralPath $buildLog -Pattern "JENOVA_BUILD_OK" -Quiet)) {
            throw "Jenova BuildProject did not report JENOVA_BUILD_OK; see $buildLog"
          }

      - name: Instantiate frost lab scene with built Jenova script
        shell: pwsh
        run: |
          $sceneLog = Join-Path $env:RUNNER_TEMP "jenova-frost-scene.log"
          & $env:GODOT_BIN --headless --path . --quit-after 30 "res://scenes/experimental/jenova_frost_lab.tscn" 2>&1 |
            Tee-Object -FilePath $sceneLog
          if ($LASTEXITCODE -ne 0) {
            throw "Godot failed to instantiate the Jenova frost lab scene; see $sceneLog"
          }
          if (Select-String -LiteralPath $sceneLog -Pattern "No loader found for frost_window\.cpp" -Quiet) {
            throw "Godot did not recognize frost_window.cpp while opening the frost lab scene."
          }
          if (-not (Select-String -LiteralPath $sceneLog -Pattern "\[jenova-frost\] C\+\+ controller ready" -Quiet)) {
            throw "Godot opened the frost scene without running the built Jenova C++ controller."
          }

      - name: Report exact Jenova package file sizes
        shell: pwsh
        run: |
          $files = Get-ChildItem Jenova -File -Recurse | Sort-Object FullName
          $oversized = @($files | Where-Object { $_.Length -ge 100MB })
          foreach ($file in $oversized) {
            $relativePath = [System.IO.Path]::GetRelativePath((Get-Location).Path, $file.FullName).Replace('\', '/')
            $attribute = & git check-attr filter -- $relativePath
            if ($LASTEXITCODE -ne 0 -or $attribute -notmatch ": filter: lfs$") {
              throw "Large Jenova file must be tracked by Git LFS: $($file.Length) bytes $relativePath"
            }
          }
          $files | ForEach-Object { "{0}`t{1}" -f $_.Length, $_.FullName }
          "Windows Jenova runtime: $((Get-Item Jenova/Jenova.Runtime.Win64.dll).Length) bytes" |
            Add-Content $env:GITHUB_STEP_SUMMARY
          "Tracked-package candidate total: $((($files | Measure-Object Length -Sum).Sum)) bytes" |
            Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Upload Windows Jenova vendor package
        uses: actions/upload-artifact@v4
        with:
          name: hoarbound-jenova-windows-vendor
          path: Jenova/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  motion-matching-preview:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[motion-matching-preview]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/opt/godot-mono
          key: godot-4.8-dev6-v2

      - name: Provision Godot + CPU Vulkan
        run: tools/ci/setup_env.sh

      - name: Import gate
        run: tools/ci/import_gate.sh

      - name: Dataset and retarget audit (headless)
        run: |
          "$HOME/.local/bin/godot" --headless --path . --script res://tools/runtime/audit_motion_dataset.gd

      - name: Capture retarget diagnostics and motion matching proof
        run: |
          export VK_DRIVER_FILES=/usr/share/vulkan/icd.d/lvp_icd.json
          export XDG_RUNTIME_DIR=/tmp/xdg
          mkdir -p "$XDG_RUNTIME_DIR"
          run_godot() {
            MM_DIAG_VIDEO=0 xvfb-run -a "$HOME/.local/bin/godot" \
              --path . \
              --resolution 1280x720 \
              --rendering-driver vulkan \
              --rendering-method forward_plus \
              --audio-driver Dummy \
              --script "$@"
          }
          # 100STYLE is unverified: diagnostics only, never baked.
          run_godot tools/runtime/capture_motion_retarget_diagnostics.gd -- \
            CMU:09_12 CMU:113_17 CMU:41_02 CMU:111_28 CMU:69_18 CMU:40_04 \
            100STYLE:Neutral_SW 100STYLE:Neutral_TR1
          run_godot tools/runtime/capture_motion_matching_lab.gd

      - name: In-game A/B on the real Player (headless, tree vs Motion Matching)
        run: |
          for flag in 0 1; do
            HOARBOUND_MOTION_MATCHING=$flag MM_HEADLESS_PROOF=1 \
              MM_OUT_DIR=res://docs/runtime_previews/motion_matching_player_$flag \
              "$HOME/.local/bin/godot" --headless --fixed-fps 30 --path . \
              --script res://tools/runtime/capture_motion_matching_player.gd
          done

      - name: In-game A/B in a snow drift (headless, tree vs Motion Matching)
        run: |
          for flag in 0 1; do
            HOARBOUND_MOTION_MATCHING=$flag MM_HEADLESS_PROOF=1 MM_KEEP_SNOW=1 MM_PROGRAM=drift \
              MM_OUT_DIR=res://docs/runtime_previews/motion_matching_drift_$flag \
              "$HOME/.local/bin/godot" --headless --fixed-fps 30 --path . \
              --script res://tools/runtime/capture_motion_matching_player.gd
          done

      - name: Encode preview video
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          ffmpeg -y \
            -framerate 30 \
            -i docs/runtime_previews/motion_matching_lab/frames/%04d.png \
            -c:v libx264 \
            -preset veryfast \
            -crf 22 \
            -pix_fmt yuv420p \
            docs/runtime_previews/motion_matching_lab/motion_matching_proof.mp4
          rm -rf docs/runtime_previews/motion_matching_lab/frames

      - name: Upload motion matching preview
        uses: actions/upload-artifact@v4
        with:
          name: hoarbound-motion-matching-proof
          path: |
            docs/runtime_previews/motion_matching_lab/*.mp4
            docs/runtime_previews/motion_matching_lab/*.png
            docs/runtime_previews/motion_matching_lab/*.json
            docs/runtime_previews/motion_retarget_diagnostics/*.png
            docs/runtime_previews/motion_retarget_diagnostics/report.json
            docs/runtime_previews/motion_matching_player_*/report.json
            docs/runtime_previews/motion_matching_drift_*/report.json
          if-no-files-found: error
          retention-days: 7

  dev-map-preview:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[dev-map-preview]')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/opt/godot-mono
          key: godot-4.8-dev6-v2

      - name: Provision Godot + CPU Vulkan
        run: tools/ci/setup_env.sh

      - name: Import gate
        run: tools/ci/import_gate.sh

      - name: Capture developer diorama map
        run: |
          export VK_DRIVER_FILES=/usr/share/vulkan/icd.d/lvp_icd.json
          export XDG_RUNTIME_DIR=/tmp/xdg
          mkdir -p "$XDG_RUNTIME_DIR"
          xvfb-run -a "$HOME/.local/bin/godot" \
            --path . \
            --resolution 1600x1000 \
            --rendering-driver vulkan \
            --rendering-method forward_plus \
            --audio-driver Dummy \
            --script tools/runtime/capture_dev_diorama_map.gd

      - name: Upload developer diorama previews
        uses: actions/upload-artifact@v4
        with:
          name: hoarbound-dev-diorama-map
          path: docs/runtime_previews/dev_diorama_map/*.png
          if-no-files-found: error
          retention-days: 3

  key-west-preview:
    if: github.event_name == 'push' && (contains(github.event.head_commit.message, '[key-west-preview]') || contains(github.event.head_commit.message, '[key-west-tps]') || contains(github.event.head_commit.message, '[key-west-first-exit]') || contains(github.event.head_commit.message, '[stylized-shadows]') || contains(github.event.head_commit.message, '[sky-weather-preview]'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/opt/godot-mono
          key: godot-4.8-dev6-v2

      - name: Provision Godot + CPU Vulkan
        run: tools/ci/setup_env.sh

      - name: Install terrain conversion tools
        if: "!contains(github.event.head_commit.message, '[stylized-shadows]') && !contains(github.event.head_commit.message, '[sky-weather-preview]')"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gdal-bin python3-numpy python3-pil python3-pyproj

      - name: Seed frozen production Key West snapshots
        if: contains(github.event.head_commit.message, '[key-west-tps]') || contains(github.event.head_commit.message, '[key-west-first-exit]')
        run: |
          mkdir -p docs/runtime_previews/key_west
          cp data/world/key_west/city_preview.json docs/runtime_previews/key_west/city_preview.json
          cp data/world/key_west/visual_enrichment.json docs/runtime_previews/key_west/visual_enrichment.json

      - name: Verify tracked production snapshots
        if: contains(github.event.head_commit.message, '[stylized-shadows]') || contains(github.event.head_commit.message, '[sky-weather-preview]')
        run: |
          test -s data/world/key_west/city_preview.json
          test -s data/world/key_west/visual_enrichment.json
          test -s data/world/key_west/ocean_connected_mask.png
          test -s world/terrain/key_west_preview_2m_la8.png
          test -s world/terrain/key_west_preview_2m_la8.json

      - name: Build NOAA Key West preview terrain
        if: "!contains(github.event.head_commit.message, '[stylized-shadows]') && !contains(github.event.head_commit.message, '[sky-weather-preview]')"
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [[ "$COMMIT_MESSAGE" == *"[key-west-tps]"* || "$COMMIT_MESSAGE" == *"[key-west-first-exit]"* ]]; then
            HFN_REUSE_CITY_JSON=1 bash tools/world/build_key_west_preview.sh
          else
            bash tools/world/build_key_west_preview.sh
          fi

      - name: Import generated preview assets
        run: tools/ci/import_gate.sh

      - name: Verify StreamingSystem runtime chunks
        if: contains(github.event.head_commit.message, '[key-west-tps]') || contains(github.event.head_commit.message, '[key-west-first-exit]')
        run: |
          "$HOME/.local/bin/godot" --headless --path . --script tests/systems/test_streaming.gd

      - name: Capture Key West
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          export VK_DRIVER_FILES=/usr/share/vulkan/icd.d/lvp_icd.json
          export XDG_RUNTIME_DIR=/tmp/xdg
          mkdir -p "$XDG_RUNTIME_DIR"
          SCRIPT="tools/runtime/capture_key_west.gd"
          if [[ "$COMMIT_MESSAGE" == *"[sky-weather-preview]"* ]]; then
            SCRIPT="tools/runtime/capture_sky_weather.gd"
          elif [[ "$COMMIT_MESSAGE" == *"[stylized-shadows]"* ]]; then
            "$HOME/.local/bin/godot" --headless --path . --script tests/systems/test_stylized_shadows.gd
            SCRIPT="tools/runtime/capture_stylized_shadows.gd"
          elif [[ "$COMMIT_MESSAGE" == *"[key-west-first-exit]"* ]]; then
            "$HOME/.local/bin/godot" --headless --path . --script tests/systems/test_key_west_first_exit.gd
            SCRIPT="tools/runtime/capture_key_west_first_exit.gd"
          elif [[ "$COMMIT_MESSAGE" == *"[key-west-tps]"* ]]; then
            SCRIPT="tools/runtime/capture_key_west_tps.gd"
          fi
          xvfb-run -a "$HOME/.local/bin/godot" \
            --path . \
            --resolution 1600x1000 \
            --rendering-driver vulkan \
            --rendering-method forward_plus \
            --audio-driver Dummy \
            --script "$SCRIPT"

      - name: Upload Key West previews
        uses: actions/upload-artifact@v4
        with:
          name: ${{ contains(github.event.head_commit.message, '[sky-weather-preview]') && 'hoarbound-sky-weather' || (contains(github.event.head_commit.message, '[stylized-shadows]') && 'hoarbound-stylized-shadows' || (contains(github.event.head_commit.message, '[key-west-first-exit]') && 'hoarbound-key-west-first-exit' || (contains(github.event.head_commit.message, '[key-west-tps]') && 'hoarbound-key-west-tps' || 'hoarbound-key-west-preview'))) }}
          path: |
            docs/runtime_previews/key_west/*.png
            docs/runtime_previews/key_west/source_report.json
            docs/runtime_previews/key_west/city_preview.json
            docs/runtime_previews/key_west/ocean_connected_mask.png
            docs/runtime_previews/key_west/visual_enrichment.json
            docs/runtime_previews/key_west_tps/*.png
            docs/runtime_previews/key_west_tps/stream_report.json
            docs/runtime_previews/key_west_first_exit/*.png
            docs/runtime_previews/key_west_first_exit/report.json
            docs/runtime_previews/stylized_shadows/*.png
            docs/runtime_previews/stylized_shadows/report.json
            docs/runtime_previews/sky_weather/*.png
            docs/runtime_previews/sky_weather/report.json
          if-no-files-found: error
          retention-days: 3