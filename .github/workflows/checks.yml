name: checks

## `checks` is the cheap gate on every push and PR: import, input map, filenames.
## Test suites run locally until mechanics settle; they churn too fast to gate main.
## Preview/render jobs run only for a commit tagged with their [marker].
on:
  push:
    branches: [main, codex, claudeflow]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/opt/godot-mono
          key: godot-4.8-dev6-v2

      - name: Provision Godot (headless only)
        run: SKIP_APT=1 tools/ci/setup_env.sh

      - name: Import gate (clean import, every script compiles)
        run: tools/ci/import_gate.sh

      - name: Input map overlaps
        run: python3 tools/ci/check_input_map.py

      - name: Check filenames and uid files
        run: tools/ci/check_filenames.sh

  key-west-reality:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[key-west-reality]')
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/opt/godot-mono
          key: godot-4.8-dev6-v2

      - name: Provision Godot + CPU Vulkan
        run: tools/ci/setup_env.sh

      - name: Import gate
        run: tools/ci/import_gate.sh

      - name: Unpack the committed editor interchange (sha256-checked)
        run: python3 tools/world/reality/export_pack.py unpack

      - name: Rebuild the generated chunks and verify the recorded digest
        run: |
          export VK_DRIVER_FILES=/usr/share/vulkan/icd.d/lvp_icd.json
          export XDG_RUNTIME_DIR=/tmp/xdg
          mkdir -p "$XDG_RUNTIME_DIR"
          xvfb-run -a "$HOME/.local/bin/godot" --path . --rendering-driver vulkan --audio-driver Dummy \
            --script tools/world/reality_gen/generate_key_west_chunks_cli.gd -- --verify-digest | tee generate.log
          grep -q "digest verify: identical" generate.log
          grep -q "contract violations: 0" generate.log

      - name: Streaming tests
        run: |
          for t in test_streaming test_key_west_reality_ground; do
            timeout 300 "$HOME/.local/bin/godot" --headless --path . --audio-driver Dummy --script res://tests/systems/$t.gd | tee $t.log
            grep -q "all checks passed" $t.log
          done

      - name: Streaming benchmark (island drive)
        run: |
          timeout 1200 "$HOME/.local/bin/godot" --headless --path . --script tools/runtime/benchmark_key_west_reality_streaming.gd \
            -- res://docs/runtime_previews/key_west_reality_streaming island

      - name: Production gate (full World, Henry by input, fast mode)
        run: |
          timeout 2700 "$HOME/.local/bin/godot" --headless --path . --audio-driver Dummy \
            --script res://tools/runtime/gate_key_west_reality.gd -- --fast --out=res://docs/runtime_previews/key_west_reality_gate
          python3 -c "import json,sys; v=json.load(open('docs/runtime_previews/key_west_reality_gate/gate_report.json'))['verdict']; print(v); sys.exit(0 if all(v.values()) else 1)"

      - name: Upload reality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hoarbound-key-west-reality
          path: |
            docs/runtime_previews/key_west_reality_streaming/*.json
            docs/runtime_previews/key_west_reality_gate/*.json
            scenes/world/key_west/generated/generation_report.json
          if-no-files-found: warn
          retention-days: 7

  key-west-preview:
    if: github.event_name == 'push' && (contains(github.event.head_commit.message, '[key-west-preview]') || contains(github.event.head_commit.message, '[key-west-tps]') || contains(github.event.head_commit.message, '[key-west-first-exit]') || contains(github.event.head_commit.message, '[stylized-shadows]') || contains(github.event.head_commit.message, '[sky-weather-preview]'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/opt/godot-mono
          key: godot-4.8-dev6-v2

      - name: Provision Godot + CPU Vulkan
        run: tools/ci/setup_env.sh

      - name: Install terrain conversion tools
        if: "!contains(github.event.head_commit.message, '[stylized-shadows]') && !contains(github.event.head_commit.message, '[sky-weather-preview]')"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gdal-bin python3-numpy python3-pil python3-pyproj

      - name: Seed frozen production Key West snapshots
        if: contains(github.event.head_commit.message, '[key-west-tps]') || contains(github.event.head_commit.message, '[key-west-first-exit]')
        run: |
          mkdir -p docs/runtime_previews/key_west
          cp data/world/key_west/city_preview.json docs/runtime_previews/key_west/city_preview.json
          cp data/world/key_west/visual_enrichment.json docs/runtime_previews/key_west/visual_enrichment.json

      - name: Verify tracked production snapshots
        if: contains(github.event.head_commit.message, '[stylized-shadows]') || contains(github.event.head_commit.message, '[sky-weather-preview]')
        run: |
          test -s data/world/key_west/city_preview.json
          test -s data/world/key_west/visual_enrichment.json
          test -s data/world/key_west/ocean_connected_mask.png
          test -s world/terrain/key_west_preview_2m_la8.png
          test -s world/terrain/key_west_preview_2m_la8.json

      - name: Build NOAA Key West preview terrain
        if: "!contains(github.event.head_commit.message, '[stylized-shadows]') && !contains(github.event.head_commit.message, '[sky-weather-preview]')"
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [[ "$COMMIT_MESSAGE" == *"[key-west-tps]"* || "$COMMIT_MESSAGE" == *"[key-west-first-exit]"* ]]; then
            HFN_REUSE_CITY_JSON=1 bash tools/world/build_key_west_preview.sh
          else
            bash tools/world/build_key_west_preview.sh
          fi

      - name: Import generated preview assets
        run: tools/ci/import_gate.sh

      - name: Verify StreamingSystem runtime chunks
        if: contains(github.event.head_commit.message, '[key-west-tps]') || contains(github.event.head_commit.message, '[key-west-first-exit]')
        run: |
          "$HOME/.local/bin/godot" --headless --path . --script tests/systems/test_streaming.gd

      - name: Capture Key West
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          export VK_DRIVER_FILES=/usr/share/vulkan/icd.d/lvp_icd.json
          export XDG_RUNTIME_DIR=/tmp/xdg
          mkdir -p "$XDG_RUNTIME_DIR"
          SCRIPT="tools/runtime/capture_key_west.gd"
          if [[ "$COMMIT_MESSAGE" == *"[sky-weather-preview]"* ]]; then
            SCRIPT="tools/runtime/capture_sky_weather.gd"
          elif [[ "$COMMIT_MESSAGE" == *"[stylized-shadows]"* ]]; then
            "$HOME/.local/bin/godot" --headless --path . --script tests/systems/test_stylized_shadows.gd
            SCRIPT="tools/runtime/capture_stylized_shadows.gd"
          elif [[ "$COMMIT_MESSAGE" == *"[key-west-first-exit]"* ]]; then
            "$HOME/.local/bin/godot" --headless --path . --script tests/systems/test_key_west_first_exit.gd
            SCRIPT="tools/runtime/capture_key_west_first_exit.gd"
          elif [[ "$COMMIT_MESSAGE" == *"[key-west-tps]"* ]]; then
            SCRIPT="tools/runtime/capture_key_west_tps.gd"
          fi
          xvfb-run -a "$HOME/.local/bin/godot" \
            --path . \
            --resolution 1600x1000 \
            --rendering-driver vulkan \
            --rendering-method forward_plus \
            --audio-driver Dummy \
            --script "$SCRIPT"

      - name: Upload Key West previews
        uses: actions/upload-artifact@v4
        with:
          name: ${{ contains(github.event.head_commit.message, '[sky-weather-preview]') && 'hoarbound-sky-weather' || (contains(github.event.head_commit.message, '[stylized-shadows]') && 'hoarbound-stylized-shadows' || (contains(github.event.head_commit.message, '[key-west-first-exit]') && 'hoarbound-key-west-first-exit' || (contains(github.event.head_commit.message, '[key-west-tps]') && 'hoarbound-key-west-tps' || 'hoarbound-key-west-preview'))) }}
          path: |
            docs/runtime_previews/key_west/*.png
            docs/runtime_previews/key_west/source_report.json
            docs/runtime_previews/key_west/city_preview.json
            docs/runtime_previews/key_west/ocean_connected_mask.png
            docs/runtime_previews/key_west/visual_enrichment.json
            docs/runtime_previews/key_west_tps/*.png
            docs/runtime_previews/key_west_tps/stream_report.json
            docs/runtime_previews/key_west_first_exit/*.png
            docs/runtime_previews/key_west_first_exit/report.json
            docs/runtime_previews/stylized_shadows/*.png
            docs/runtime_previews/stylized_shadows/report.json
            docs/runtime_previews/sky_weather/*.png
            docs/runtime_previews/sky_weather/report.json
          if-no-files-found: error
          retention-days: 3