name: color-grade-blend

## Dual-LUT blend review: 5 s outdoor→shelter + 5 s outdoor Day/Dusk/Night.
## Runs on workflow_dispatch or push with [color-grade-blend] or [ambient-glow] in the commit message.
## Artifacts: hoarbound-color-grade-blend or hoarbound-ambient-glow (MP4 + review PNGs).
on:
  workflow_dispatch:
  push:
    branches: [main, grok, codex, claudeflow]
    paths-ignore:
      - "**/*.md"

concurrency:
  group: color-grade-blend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && (contains(github.event.head_commit.message, '[color-grade-blend]') || contains(github.event.head_commit.message, '[ambient-glow]')))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/opt/godot-mono
          key: godot-4.8-dev6-v2

      - name: Provision Godot + CPU Vulkan
        run: tools/ci/setup_env.sh

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Import gate
        run: tools/ci/import_gate.sh

      - name: Capture dual-LUT blend videos
        if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[ambient-glow]') }}
        run: |
          export VK_DRIVER_FILES=/usr/share/vulkan/icd.d/lvp_icd.json
          export XDG_RUNTIME_DIR=/tmp/xdg
          mkdir -p "$XDG_RUNTIME_DIR" docs/runtime_previews/color_grade_blend
          set -o pipefail
          xvfb-run -a "$HOME/.local/bin/godot" \
            --path . \
            --resolution 960x540 \
            --fixed-fps 30 \
            --rendering-driver vulkan \
            --rendering-method forward_plus \
            --audio-driver Dummy \
            --script res://tools/runtime/capture_color_grade_blend.gd \
            2>&1 | tee docs/runtime_previews/color_grade_blend/capture.log
          if grep -q "SHADER ERROR" docs/runtime_previews/color_grade_blend/capture.log; then
            echo "Shader compilation error in capture log."
            exit 1
          fi
          test -s docs/runtime_previews/color_grade_blend/shelter_outdoor_to_inside_5s.mp4 \
            || test -d docs/runtime_previews/color_grade_blend/shelter_5s
          ls -la docs/runtime_previews/color_grade_blend/ || true

      - name: Capture ambient edge glow (6 seconds)
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[ambient-glow]') }}
        run: |
          export VK_DRIVER_FILES=/usr/share/vulkan/icd.d/lvp_icd.json
          export XDG_RUNTIME_DIR=/tmp/xdg
          mkdir -p "$XDG_RUNTIME_DIR" docs/runtime_previews/ambient_glow
          set -o pipefail
          xvfb-run -a "$HOME/.local/bin/godot" \
            --path . \
            --resolution 960x540 \
            --fixed-fps 30 \
            --rendering-driver vulkan \
            --rendering-method forward_plus \
            --audio-driver Dummy \
            --script res://tools/runtime/capture_ambient_glow.gd \
            2>&1 | tee docs/runtime_previews/ambient_glow/capture.log
          if grep -q "SHADER ERROR\|AMBIENT_GLOW_CAPTURE_FAIL\|SCRIPT ERROR" docs/runtime_previews/ambient_glow/capture.log; then
            echo "Ambient glow capture shader/script error"
            exit 1
          fi
          grep -q "AMBIENT_GLOW_CAPTURE_OK" docs/runtime_previews/ambient_glow/capture.log
          test -s docs/runtime_previews/ambient_glow/ambient_edge_glow_6s.mp4
          python3 -c 'import subprocess; p="docs/runtime_previews/ambient_glow/ambient_edge_glow_6s.mp4"; v=float(subprocess.check_output(["ffprobe","-v","error","-show_entries","format=duration","-of","default=noprint_wrappers=1:nokey=1",p])); print("MP4 duration",v); assert abs(v-6.0) < 0.06'

      - name: Upload ambient glow preview
        if: ${{ always() && github.event_name == 'push' && contains(github.event.head_commit.message, '[ambient-glow]') }}
        uses: actions/upload-artifact@v4
        with:
          name: hoarbound-ambient-glow
          path: |
            docs/runtime_previews/ambient_glow/ambient_edge_glow_6s.mp4
            docs/runtime_previews/ambient_glow/review_*.png
            docs/runtime_previews/ambient_glow/capture.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload blend artifacts
        if: ${{ always() && (github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[ambient-glow]')) }}
        uses: actions/upload-artifact@v4
        with:
          name: hoarbound-color-grade-blend
          path: |
            docs/runtime_previews/color_grade_blend/**/*.mp4
            docs/runtime_previews/color_grade_blend/**/*.png
            docs/runtime_previews/color_grade_blend/capture.log
          if-no-files-found: warn
          retention-days: 3
